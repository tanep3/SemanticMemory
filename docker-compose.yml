services:
  semanticmemory:
    build: .
    network_mode: host
    container_name: semanticmemory_app
    volumes:
      - ./datas:/app/datas
      - ./logs:/app/logs
    environment:
      - APP_PORT=6001
      - SQLITE_PATH=/app/datas/semantic_memory.db
      - CHROMA_PATH=/app/datas/chroma
      - OLLAMA_URL=http://localhost:11434

    # ログローテーション設定（ディスク圧迫防止）
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # ヘルスチェック（自動復旧）
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6001/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    restart: unless-stopped
