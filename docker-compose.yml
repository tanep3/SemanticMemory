services:
  semanticmemory:
    build: .
    container_name: semanticmemory_app
    ports:
      - "6001:6001"
    volumes:
      - ./src:/app/src:ro
      - ./datas:/app/datas
      - ./logs:/app/logs
      - ./hf_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - APP_PORT=6001
      - SQLITE_PATH=/app/datas/semantic_memory.db
      - CHROMA_PATH=/app/datas/chroma
      - OLLAMA_URL=http://host.docker.internal:11434
      - TRANSFORMERS_CACHE=/root/.cache/huggingface

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ログローテーション設定（ディスク圧迫防止）
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # ヘルスチェック（自動復旧）
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6001/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    restart: unless-stopped
